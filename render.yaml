# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo on Render and use "Apply" with this file, or set the
# Web Service settings manually to match below.

services:
  - type: web
    name: onlineshare
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      # Paste your Supabase connection string in the Render dashboard
      - key: DATABASE_URL
        sync: false
